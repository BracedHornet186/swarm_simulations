/**:
  ros__parameters:
    use_sim_time: true


graph_observer:
  ros__parameters:
    delta_radius: 3.0
    frequency: 2.0


reference_node:
  ros__parameters:
    frequency: 2.0


kinematic_node:
  ros__parameters:
    sampling_freq: 2.0
    M: [-4.0, 0.0, 
        0.0, -4.0]
    nu: 2.0
    eps: 0.01
    beta: 0.5
    robot_radius: 0.5


mpc_controller:
  ros__parameters:
    mpc_horizon: 20
    max_linear_velocity: 1.0
    max_angular_velocity: 1.0
    max_linear_acceleration: 1.0
    max_angular_acceleration: 0.5
    control_frequency: 5.0

dmpc_controller:
  ros__parameters:
    mpc_horizon: 20
    max_linear_velocity: 1.0
    max_angular_velocity: 1.0
    max_linear_acceleration: 1.0
    max_angular_acceleration: 0.5
    max_deviation: 0.2
    safe_distance: 0.4
    control_frequency: 10.0